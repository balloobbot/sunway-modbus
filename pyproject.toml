[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sunway-modbus"
version = "0.1.0"
description = "Read and control a SunWay STT hybrid solar inverter over Modbus."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "sunway-modbus contributors" }]
keywords = ["modbus", "sunway", "inverter", "solar", "battery", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
# Protocol + the device-modelling framework (modbus_connection.model). The caller
# injects a ModbusUnit built from whichever backend they choose.
dependencies = ["modbus-connection[tmodbus]>=4.6.1"]

[project.urls]
Homepage = "https://github.com/balloobbot/sunway-modbus"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
    "mypy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sunway_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["sunway_modbus", "tests"]
strict = true
